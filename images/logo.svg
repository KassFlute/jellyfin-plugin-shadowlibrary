    </g>
    <rect x="755" y="430" width="342" height="12" rx="6" fill="#6f66b8" fill-opacity="0.6"/>

    <path d="M 612 300 Q 682 220 752 300" fill="none" stroke="url(#beam)" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 13"/>
    <path d="M 749.8 280.1 L 752 300 L 732.6 295.2" fill="none" stroke="#4fd8f5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
