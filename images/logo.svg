<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <!-- the original sits in the light, its copy in the dark -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#29245c"/>
      <stop offset="0.5" stop-color="#17142f"/>
      <stop offset="1" stop-color="#0a0916"/>
    </linearGradient>
    <radialGradient id="light" cx="400" cy="330" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7a6cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7a6cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="book" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a8cff"/><stop offset="1" stop-color="#5546cf"/>
    </linearGradient>
    <linearGradient id="book2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fd8f5"/><stop offset="1" stop-color="#1a86bd"/>
    </linearGradient>
    <linearGradient id="book3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bf8cf7"/><stop offset="1" stop-color="#7a42c4"/>
    </linearGradient>
    <linearGradient id="ghost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2660"/><stop offset="1" stop-color="#0c0b1d"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f80ff"/><stop offset="1" stop-color="#4fd8f5"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#light)"/>

  <g transform="translate(640 360) scale(1.15) translate(-671 -311)">
    <g>
      <rect x="270" y="210" width="50" height="220" rx="7" fill="url(#book)"/>
      <rect x="282" y="236" width="26" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.35"/>
      <rect x="282" y="248" width="26" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.35"/>
      <rect x="328" y="180" width="60" height="250" rx="7" fill="url(#book2)"/>
      <rect x="340" y="206" width="36" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.35"/>
      <rect x="340" y="218" width="36" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.35"/>
      <rect x="396" y="230" width="46" height="200" rx="7" fill="url(#book3)"/>
      <rect x="408" y="256" width="22" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.35"/>
      <rect x="408" y="268" width="22" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.35"/>
      <rect x="450" y="195" width="56" height="235" rx="7" fill="url(#book)"/>
      <rect x="462" y="221" width="32" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.35"/>
      <rect x="462" y="233" width="32" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.35"/>
      <rect x="514" y="240" width="48" height="190" rx="7" fill="url(#book2)" transform="rotate(10 538.0 430)"/>
    </g>
    <rect x="245" y="430" width="342" height="12" rx="6" fill="#d9d4ff" fill-opacity="0.85"/>

    <g>
      <rect x="780" y="210" width="50" height="220" rx="7" fill="url(#ghost)" stroke="#9b8fff" stroke-opacity="0.6" stroke-width="2.5"/>
      <rect x="792" y="236" width="26" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.1"/>
      <rect x="792" y="248" width="26" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.1"/>
      <rect x="838" y="180" width="60" height="250" rx="7" fill="url(#ghost)" stroke="#9b8fff" stroke-opacity="0.6" stroke-width="2.5"/>
      <rect x="850" y="206" width="36" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.1"/>
      <rect x="850" y="218" width="36" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.1"/>
      <rect x="906" y="230" width="46" height="200" rx="7" fill="url(#ghost)" stroke="#9b8fff" stroke-opacity="0.6" stroke-width="2.5"/>
      <rect x="918" y="256" width="22" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.1"/>
      <rect x="918" y="268" width="22" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.1"/>
      <rect x="960" y="195" width="56" height="235" rx="7" fill="url(#ghost)" stroke="#9b8fff" stroke-opacity="0.6" stroke-width="2.5"/>
      <rect x="972" y="221" width="32" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.1"/>
