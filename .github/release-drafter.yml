# Drafts the next release from the pull requests merged since the last one. The categories
# come from the labels, so a pull request that carries none lands in the flat list.
name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
# Jellyfin plugin versions are four numbers, the fourth one is never used here
version-template: '$MAJOR.$MINOR.$PATCH.0'
category-template: '### $TITLE'

categories:
  - title: ':boom: Breaking changes'
    labels:
      - breaking
  - title: ':rocket: Features'
    labels:
      - feature
      - enhancement
  - title: ':bug: Bug fixes'
    labels:
      - bug
      - fix
      - regression
  - title: ':memo: Documentation'
    labels:
      - documentation
  - title: ':arrow_up: Dependencies'
    labels:
      - dependencies
  - title: ':construction_worker: CI and repository'
    labels:
      - ci
      - chore

exclude-labels:
  - skip-changelog
  - invalid

version-resolver:
  major:
    labels:
      - breaking
  minor:
    labels:
      - feature
      - enhancement
  default: patch

autolabeler:
  - label: ci
    files:
      - '.github/**'
  - label: documentation
    files:
      - '**/*.md'
  - label: bug
    title:
      - '/^fix/i'

template: |-
  ## :sparkles: What's new

  $CHANGES

  Installing through the plugin repository is the supported route, the dashboard picks this
  version up on its next check. The zip below is for a manual install.
