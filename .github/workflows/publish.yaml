name: '🚀 Publish'

on:
  release:
    types:
      - released

permissions:
  contents: write

jobs:
  publish:
    name: Publish release and update the plugin repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # a tag may or may not carry a leading v, the version written into the assembly and the
      # manifest never does
      - name: Read the version from the tag
        id: version
        run: |
          version="${{ github.event.release.tag_name }}"
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

      - name: Build plugin
        uses: oddstr13/jellyfin-plugin-repository-manager@v1.1.1
        id: jprm
        with:
          dotnet-target: net9.0
          version: ${{ steps.version.outputs.version }}

      - name: Write checksums
        id: assets
        run: |
          artifact='${{ steps.jprm.outputs.artifact }}'
          directory="$(dirname "${artifact}")"
          filename="$(basename "${artifact}")"
          cd "${directory}"
          md5sum "${filename}" > "${filename}.md5"
          sha256sum "${filename}" > "${filename}.sha256"
          echo "directory=${directory}" >> "$GITHUB_OUTPUT"
          echo "filename=${filename}" >> "$GITHUB_OUTPUT"

      - name: Attach assets to the release
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ${{ steps.assets.outputs.directory }}/*

      # the manifest is what a Jellyfin server reads, so it has to point at the release asset
      # that was just published rather than at anything inside this repository
      - name: Add the release to the plugin repository manifest
        run: |
          python3 -m pip install --upgrade jprm
          git fetch origin main
          git checkout main
          jprm --verbosity=debug repo add \
            --plugin-url='https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/${{ steps.assets.outputs.filename }}' \
            manifest.json \
            '${{ steps.jprm.outputs.artifact }}'

      - name: Commit the manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json
          git commit -m 'Publish ShadowLibrary ${{ steps.version.outputs.version }}'
          git push origin main
